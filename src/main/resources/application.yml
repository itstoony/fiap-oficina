spring:
  application:
    name: oficina

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

oficina:
  app:
    url: ${APP_URL:http://localhost:8080}
  jwt:
    secret: ${OFICINA_JWT_SECRET:chave-secreta-minimo-256-bits-para-o-jwt-do-sistema-oficina}
    expiracao: ${OFICINA_JWT_EXPIRACAO:3600000}
  admin:
    login: ${OFICINA_ADMIN_LOGIN:admin}
    senha: ${OFICINA_ADMIN_SENHA:admin123}
  seguranca:
    bcrypt-strength: ${OFICINA_BCRYPT_STRENGTH:10}
    cors:
      allowed-origins: ${OFICINA_CORS_ORIGINS:http://localhost:3000}
