spring:
  application:
    name: oficina

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:oficina}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

oficina:
  jwt:
    secret: ${OFICINA_JWT_SECRET:chave-secreta-minimo-256-bits-para-o-jwt-do-sistema-oficina}
    expiracao: ${OFICINA_JWT_EXPIRACAO:3600000}
  admin:
    login: ${OFICINA_ADMIN_LOGIN:admin}
    senha: ${OFICINA_ADMIN_SENHA:admin123}
  seguranca:
    bcrypt-strength: ${OFICINA_BCRYPT_STRENGTH:10}
    cors:
      allowed-origins: ${OFICINA_CORS_ORIGINS:http://localhost:3000}
