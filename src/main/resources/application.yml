spring:
  application:
    name: oficina

  datasource:
    url: jdbc:postgresql://localhost:5432/oficina
    username: oficina
    password: oficina

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

oficina:
  jwt:
    secret: chave-secreta-minimo-256-bits-para-o-jwt-do-sistema-oficina
    expiracao: 86400000
  admin:
    login: ${OFICINA_ADMIN_LOGIN:admin}
    senha: ${OFICINA_ADMIN_SENHA:admin123}
  seguranca:
    bcrypt-strength: ${OFICINA_BCRYPT_STRENGTH:10}
    cors:
      allowed-origins: ${OFICINA_CORS_ORIGINS:http://localhost:3000}