name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Qualidade de Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache do Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Checkstyle
        run: ./mvnw checkstyle:check
      - name: PMD + CPD
        run: ./mvnw pmd:check pmd:cpd-check
      - name: SpotBugs
        run: ./mvnw spotbugs:check

  test:
    name: Testes e Cobertura
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache do Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Rodar testes e verificar cobertura
        run: ./mvnw verify -DskipCheckstyle -DskipPmd -DskipSpotBugs
      - name: Publicar relatório JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  security:
    name: Segurança OWASP
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache do Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Cache OWASP NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: owasp-${{ hashFiles('**/pom.xml') }}
      - name: OWASP Dependency Check
        run: ./mvnw dependency-check:check
      - name: Publicar relatório OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report.html

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [ test, security ]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t oficina-app .

  deploy:
    name: Deploy GCP
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/fiap-oficina
            git pull origin main
            docker compose down
            docker compose up --build -d
